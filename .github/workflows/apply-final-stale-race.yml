name: Apply final stale lifecycle race hardening
on:
  push:
    branches: [fix/final-stale-lifecycle-races]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-stale-lifecycle-races
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python .github/final_stale_race_patch.py
      - run: rm .github/final_stale_race_patch.py .github/workflows/apply-final-stale-race.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/conditional_notifications/manager.py tests/test_lifecycle_concurrency_hardening.py .github
          git diff --cached --check
          git commit -m "fix: prevent stale lifecycle side effects"
          git push origin HEAD:fix/final-stale-lifecycle-races
