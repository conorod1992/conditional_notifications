name: CI
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Remove unsafe resolution default
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/conditional_notifications/frontend/conditional-notifications-panel-native-automation.js")
          text = path.read_text()
          old = '''      const first = nativeTriggers(definition)[0];
                definition.resolve_when = first
                  ? clone(first)
                  : {trigger:"state", entity_id:"", to:"off"};'''
          new = '''      definition.resolve_when = {trigger:"state", entity_id:"", to:"off"};'''
          if old not in text:
              raise SystemExit("expected resolution default block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/conditional_notifications/frontend/conditional-notifications-panel-native-automation.js
          git commit -m "fix: require explicit resolution trigger"
          git push origin HEAD:${{ github.head_ref }}
