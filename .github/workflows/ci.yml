name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lifecycle-concurrency-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install ruff==0.12.7
      - name: Apply canonical Ruff formatting and restore CI
        run: |
          ruff format custom_components/conditional_notifications/manager.py custom_components/conditional_notifications/delivery.py tests/test_lifecycle_concurrency_hardening.py
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/conditional_notifications/manager.py custom_components/conditional_notifications/delivery.py tests/test_lifecycle_concurrency_hardening.py .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:fix/lifecycle-concurrency-hardening
