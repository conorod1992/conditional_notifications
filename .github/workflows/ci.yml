name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements_test.txt
      - name: Apply Ruff lint fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          ruff check --fix --unsafe-fixes .
          ruff format .
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add custom_components/conditional_notifications/native_automation.py custom_components/conditional_notifications/native_manager.py custom_components/conditional_notifications/native_security.py custom_components/conditional_notifications/native_validation.py tests/test_native_automation.py
            git commit -m "style: fix native automation lint"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy custom_components/conditional_notifications
      - run: pytest --cov=custom_components.conditional_notifications --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code
