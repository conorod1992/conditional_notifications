name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edge-case-correctness
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements_test.txt
      - run: |
          ruff format custom_components/conditional_notifications/manager.py custom_components/conditional_notifications/storage.py tests/test_edge_case_correctness.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- custom_components/conditional_notifications/manager.py custom_components/conditional_notifications/storage.py tests/test_edge_case_correctness.py
          git commit -m "Apply Ruff formatting"
          git push origin HEAD:fix/edge-case-correctness
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code
