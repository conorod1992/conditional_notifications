name: Apply final robustness fixes
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/final-robustness-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-robustness-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install ruff==0.12.7
      - name: Apply final bug-sweep fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent, indent

          ROOT = Path("custom_components/conditional_notifications")

          def sub(path: Path, pattern: str, replacement: str, *, count: int = 1) -> None:
              text = path.read_text()
              updated, matches = re.subn(pattern, replacement, text, count=count, flags=re.MULTILINE | re.DOTALL)
              if matches != count:
                  raise SystemExit(f"{path}: expected {count} match(es), got {matches}: {pattern[:100]}")
              path.write_text(updated)

          def replace(path: Path, old: str, new: str, *, count: int = 1) -> None:
              text = path.read_text()
              matches = text.count(old)
              if matches < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), got {matches}: {old[:100]!r}")
              path.write_text(text.replace(old, new, count))

          init = ROOT / "__init__.py"
          sub(
              init,
              r'^        await hass\.http\.async_register_static_paths\(\n.*?^        frontend\.async_register_built_in_panel\(',
              indent(dedent('''\
                  if not domain_data.get("static_paths_registered"):
                      await hass.http.async_register_static_paths(
                          [
                              # Static routes live for the Home Assistant process lifetime.
                              StaticPathConfig(PANEL_URL, str(panel_file), cache_headers=False),
                              StaticPathConfig(
                                  _LIFECYCLE_PANEL_URL,
                                  str(lifecycle_panel_file),
                                  cache_headers=False,
                              ),
                              StaticPathConfig(
                                  _CORRELATION_PANEL_URL,
                                  str(correlation_panel_file),
                                  cache_headers=False,
                              ),
                              StaticPathConfig(
                                  _STATUS_PANEL_URL,
                                  str(status_panel_file),
                                  cache_headers=False,
                              ),
                              StaticPathConfig(
                                  _BASE_PANEL_URL,
                                  str(base_panel_file),
                                  cache_headers=False,
                              ),
                          ]
                      )
                      domain_data["static_paths_registered"] = True
                  frontend.async_register_built_in_panel('''), "        "),
          )

          models = ROOT / "models.py"
          replace(models, "from dataclasses import asdict, dataclass, field\n", "from dataclasses import asdict, dataclass, field\nimport math\n")
          replace(models, "from uuid import uuid4\n\nfrom .const import WEEKDAYS\n", "from uuid import uuid4\n\nfrom homeassistant.util import dt as dt_util\n\nfrom .const import WEEKDAYS\n")
          sub(
              models,
              r'^def parse_duration\(value: Any\) -> timedelta:\n.*?(?=^def duration_seconds\()',
              dedent('''\
                  def parse_duration(value: Any) -> timedelta:
                      """Parse finite seconds or a HA-style duration mapping."""
                      if value in (None, "", 0, 0.0) and not isinstance(value, bool):
                          return timedelta(0)
                      if isinstance(value, bool):
                          raise ValueError("duration must not be a boolean")
                      if isinstance(value, int | float):
                          seconds = float(value)
                          if not math.isfinite(seconds):
                              raise ValueError("duration must be finite")
                          return timedelta(seconds=seconds)
                      if isinstance(value, dict):
                          allowed = {"days", "hours", "minutes", "seconds"}
                          if set(value) - allowed:
                              raise ValueError("duration contains unsupported fields")
                          normalized: dict[str, float] = {}
                          for key, raw in value.items():
                              if isinstance(raw, bool):
                                  raise ValueError("duration fields must not be booleans")
                              number = float(raw)
                              if not math.isfinite(number):
                                  raise ValueError("duration fields must be finite")
                              normalized[key] = number
                          return timedelta(**normalized)
                      raise ValueError("duration must be seconds or a duration object")


                  '''),
          )
          replace(models, "        current = now or datetime.now().astimezone()\n", "        current = now or dt_util.now()\n")

          validation = ROOT / "validation.py"
          replace(validation, "import re\n", "import math\nimport re\n")
          replace(
              validation,
              "def _error(field: str, message: str) -> Never:\n    raise DefinitionError(field, message)\n\n\n",
              dedent('''\
                  def _error(field: str, message: str) -> Never:
                      raise DefinitionError(field, message)


                  def _finite_number(value: Any, path: str) -> float:
                      if isinstance(value, bool):
                          _error(path, "must be a finite number")
                      try:
                          number = float(value)
                      except (TypeError, ValueError):
                          _error(path, "must be a finite number")
                      if not math.isfinite(number):
                          _error(path, "must be a finite number")
                      return number


                  def _strict_bool(
                      data: dict[str, Any], key: str, path: str, *, default: bool | None = None
                  ) -> None:
                      if key in data:
                          if not isinstance(data[key], bool):
                              _error(path, "must be true or false")
                      elif default is not None:
                          data[key] = default


                  '''),
          )
          sub(
              validation,
              r'^        try:\n            if "above" in result:\n.*?^        except \(TypeError, ValueError\):\n            _error\(path, "numeric thresholds must be numbers"\)\n',
              indent(dedent('''\
                  if "above" in result:
                      result["above"] = _finite_number(result["above"], f"{path}.above")
                  if "below" in result:
                      result["below"] = _finite_number(result["below"], f"{path}.below")
                  '''), "        "),
          )
          replace(
              validation,
              '    if kind == "state" and "state" not in result:\n        _error(f"{path}.state", "is required")\n',
              '    if kind == "state":\n        if "state" not in result:\n            _error(f"{path}.state", "is required")\n        _strict_bool(result, "negate", f"{path}.negate")\n',
          )
          replace(
              validation,
              '    if policy == "limited":\n        try:\n',
              '    if policy == "limited":\n        if isinstance(result.get("max_notifications"), bool):\n            _error("max_notifications", "must be a positive integer")\n        try:\n',
          )
          sub(
              validation,
              r'^        try:\n            time\.fromisoformat\(window\["start"\]\)\n.*?^        window\["weekdays"\] = list\(dict\.fromkeys\(weekdays\)\)\n',
              indent(dedent('''\
                  if extra := set(window) - {"start", "end", "weekdays"}:
                      _error(
                          "active_window",
                          f"contains unsupported fields: {', '.join(sorted(extra))}",
                      )
                  try:
                      time.fromisoformat(window["start"])
                      time.fromisoformat(window["end"])
                  except (KeyError, TypeError, ValueError):
                      _error("active_window", "start and end must be valid local times")
                  weekdays = window.get("weekdays", list(WEEKDAYS))
                  if (
                      not isinstance(weekdays, list)
                      or not weekdays
                      or any(day not in WEEKDAYS for day in weekdays)
                  ):
                      _error(
                          "active_window.weekdays",
                          "must be a non-empty list of valid weekdays",
                      )
                  window["weekdays"] = list(dict.fromkeys(weekdays))
                  '''), "        "),
          )
          replace(
              validation,
              '    result.setdefault("notify_on_expiry", False)\n',
              indent(dedent('''\
                  for key, default in (
                      ("notify_on_expiry", False),
                      ("clear_on_resolve", True),
                      ("match_current_state", False),
                      ("enabled", True),
                  ):
                      _strict_bool(result, key, key, default=default)
                  '''), "    "),
          )
          replace(
              validation,
              '    if set(delivery) - allowed_delivery:\n        _error("delivery", "contains unsupported delivery fields")\n',
              '    if set(delivery) - allowed_delivery:\n        _error("delivery", "contains unsupported delivery fields")\n    _strict_bool(delivery, "use_defaults", "delivery.use_defaults")\n    _strict_bool(delivery, "persistent_notification", "delivery.persistent_notification")\n',
          )
          replace(validation, '    result.setdefault("enabled", True)\n    result.setdefault("match_current_state", False)\n', "")

          storage = ROOT / "storage.py"
          replace(storage, '                "history": old_data.get("history", []),\n', '                "invalid_records": old_data.get("invalid_records", []),\n                "history": old_data.get("history", []),\n')
          replace(storage, '        self.invalid_records = []\n        for item in data.get("records", []):\n', '        self.invalid_records = [\n            item for item in data.get("invalid_records", []) if isinstance(item, dict)\n        ]\n        for item in data.get("records", []):\n')
          replace(
              storage,
              '            self.records[record.id] = record\n\n        self.history = []\n',
              '            if record.id in self.records:\n                self.invalid_records.append(item)\n                _LOGGER.warning(\n                    "Ignoring duplicate Conditional Notifications record id %s", record.id\n                )\n                continue\n            self.records[record.id] = record\n\n        self.history = []\n',
          )
          sub(
              storage,
              r'^                "records": \[record\.as_dict\(\) for record in self\.records\.values\(\)\]\n                \+ self\.invalid_records,\n',
              '                "records": [record.as_dict() for record in self.records.values()],\n                "invalid_records": list(self.invalid_records),\n',
          )

          sensor = ROOT / "sensor.py"
          sub(
              sensor,
              r'^            "last_triggered": \{"id": last\.id, "name": last\.name, "at": last\.last_trigger_at\}\n            if last\n            else None,\n',
              '            "last_triggered_at": last.last_trigger_at if last else None,\n',
          )

          services = ROOT / "services.py"
          services.write_text(
              services.read_text().replace(
                  "supports_response=SupportsResponse.ONLY",
                  "supports_response=SupportsResponse.OPTIONAL",
              )
          )
          sub(
              services,
              r'(DOMAIN,\n        "list",\n        list_records,\n        schema=.*?supports_response=)SupportsResponse\.OPTIONAL',
              r'\1SupportsResponse.ONLY',
          )
          sub(
              services,
              r'(for action in \(.*?\):\n        hass\.services\.async_register\(.*?supports_response=)SupportsResponse\.OPTIONAL',
              r'\1(\n                SupportsResponse.ONLY if action == "get" else SupportsResponse.OPTIONAL\n            )',
          )

          manager = ROOT / "manager.py"
          replace(
              manager,
              "from homeassistant.core import HomeAssistant, callback\nfrom homeassistant.exceptions import HomeAssistantError\n",
              "from homeassistant.components.zone.condition import zone as zone_condition\nfrom homeassistant.core import HomeAssistant, callback\nfrom homeassistant.exceptions import ConditionError, HomeAssistantError\n",
          )
          replace(
              manager,
              "            record.definition = normalized\n            await self.async_rebuild(record)\n",
              "            record.definition = normalized\n            await self.async_rebuild(record, prove_current_durations=True)\n",
          )
          sub(
              manager,
              r'^    async def async_rebuild\(\n        self, record: NotificationRecord, \*, allow_current: bool = False\n    \) -> None:\n',
              indent(dedent('''\
                  def _seed_current_duration(
                      self,
                      runtime: RuntimeSubscriptions,
                      definition: dict[str, Any],
                      index: int,
                      accepted: Any,
                  ) -> None:
                      """Begin a fresh proof period when a state `for` trigger is already true."""
                      if (
                          definition["type"] != "state"
                          or "to" not in definition
                          or not definition.get("for")
                      ):
                          return
                      entity_id = definition["entity_id"]
                      attribute = definition.get("attribute")
                      expected = definition["to"]
                      state = self.hass.states.get(entity_id)
                      if state is None or state_value(state, attribute) != expected:
                          return
                      context = {
                          "type": "state",
                          "trigger_index": index,
                          "entity_id": entity_id,
                          "friendly_name": state.attributes.get("friendly_name", entity_id),
                          "from_state": None,
                          "to_state": state_value(state, attribute),
                          "attribute": attribute,
                          "matched_current_state": True,
                      }

                      def duration_done() -> None:
                          current = self.hass.states.get(entity_id)
                          if current is None or state_value(current, attribute) != expected:
                              return
                          current_context = deepcopy(context)
                          current_context["timestamp"] = dt_util.now().isoformat()
                          accepted(current_context)

                      runtime.schedule_duration(
                          index,
                          duration_seconds(definition.get("for")),
                          duration_done,
                      )

                  async def async_rebuild(
                      self,
                      record: NotificationRecord,
                      *,
                      allow_current: bool = False,
                      prove_current_durations: bool = False,
                  ) -> None:
                  '''), "    "),
          )
          replace(
              manager,
              "            attach_trigger(runtime, definition, index, accepted)\n",
              "            attach_trigger(runtime, definition, index, accepted)\n            if prove_current_durations:\n                self._seed_current_duration(runtime, definition, index, accepted)\n",
          )
          sub(
              manager,
              r'^        else:\n            zone = self\.hass\.states\.get\(definition\["zone_entity_id"\]\)\n            zone_name = \(\n.*?^            actual = current\.state\n',
              indent(dedent('''\
                  else:
                      try:
                          inside = zone_condition(
                              self.hass,
                              definition["zone_entity_id"],
                              current,
                          )
                      except ConditionError:
                          return None
                      matched = inside if definition["event"] == "enter" else not inside
                      actual = current.state
                  '''), "        "),
          )

          lifecycle = ROOT / "lifecycle.py"
          sub(
              lifecycle,
              r'^    async def async_rebuild\(\n        self, record: NotificationRecord, \*, allow_current: bool = False\n    \) -> None:\n',
              indent(dedent('''\
                  async def async_rebuild(
                      self,
                      record: NotificationRecord,
                      *,
                      allow_current: bool = False,
                      prove_current_durations: bool = False,
                  ) -> None:
                  '''), "    "),
          )
          replace(
              lifecycle,
              "        await super().async_rebuild(record, allow_current=allow_current)\n",
              "        await super().async_rebuild(\n            record,\n            allow_current=allow_current,\n            prove_current_durations=prove_current_durations,\n        )\n",
          )

          llm = ROOT / "llm.py"
          replace(llm, "from .manager import AmbiguousReference\n", "from .manager import AmbiguousReference, NotFound\n")
          replace(
              llm,
              '        except AmbiguousReference as err:\n            return {"error": "ambiguous", "candidates": err.candidates}\n',
              '        except AmbiguousReference as err:\n            return {"error": "ambiguous", "candidates": err.candidates}\n        except NotFound as err:\n            return {"error": "not_found", "message": str(err)}\n',
          )

          Path("tests/test_final_robustness.py").write_text(dedent('''\
              """Regression coverage for final bug-sweep robustness fixes."""

              from __future__ import annotations

              from datetime import UTC, datetime
              from types import SimpleNamespace
              from unittest.mock import AsyncMock, Mock

              import pytest
              from custom_components.conditional_notifications.const import DEFAULT_OPTIONS
              from custom_components.conditional_notifications.manager import NotificationManager
              from custom_components.conditional_notifications.models import NotificationRecord, duration_seconds
              from custom_components.conditional_notifications.sensor import ConditionalNotificationsSensor
              from custom_components.conditional_notifications.services import async_register_services
              from custom_components.conditional_notifications.storage import NotificationStore
              from custom_components.conditional_notifications.validation import DefinitionError, validate_definition
              from homeassistant.core import State, SupportsResponse


              def definition(**extra):
                  data = {
                      "name": "Watch",
                      "triggers": [{"type": "state", "entity_id": "binary_sensor.motion", "to": "on"}],
                      "title": "Watch",
                      "message": "Matched",
                  }
                  data.update(extra)
                  return data


              class FakeRawStore:
                  def __init__(self, data):
                      self.data = data
                      self.saved = None

                  async def async_load(self):
                      return self.data

                  async def async_save(self, data):
                      self.saved = data


              class FakeStates:
                  def __init__(self, states=None):
                      self.states = states or {}

                  def get(self, entity_id):
                      return self.states.get(entity_id)


              def test_duration_and_validation_reject_pathological_values():
                  with pytest.raises(ValueError, match="boolean"):
                      duration_seconds(True)
                  with pytest.raises(ValueError, match="finite"):
                      duration_seconds(float("inf"))
                  with pytest.raises(DefinitionError, match="finite number"):
                      validate_definition(definition(triggers=[{"type": "numeric_state", "entity_id": "sensor.temperature", "above": float("nan")}]))
                  with pytest.raises(DefinitionError, match="true or false"):
                      validate_definition(definition(match_current_state="false"))
                  with pytest.raises(DefinitionError, match="unsupported fields"):
                      validate_definition(definition(active_window={"start": "08:00", "end": "18:00", "weekday": ["monday"]}))


              def test_public_dict_uses_home_assistant_timezone(monkeypatch):
                  record = NotificationRecord.create(
                      definition(active_window={"start": "08:00", "end": "09:00", "weekdays": ["monday"]}),
                      "u1",
                  )
                  monkeypatch.setattr(
                      "custom_components.conditional_notifications.models.dt_util.now",
                      lambda: datetime(2026, 8, 31, 8, 30, tzinfo=UTC),
                  )
                  assert record.public_dict()["currently_active"] is True


              @pytest.mark.asyncio
              async def test_duplicate_ids_are_quarantined_separately():
                  first = NotificationRecord.create(definition(), "u1")
                  duplicate = first.as_dict()
                  duplicate["name"] = "Duplicate"
                  duplicate["definition"] = {**duplicate["definition"], "name": "Duplicate"}
                  raw = FakeRawStore({"records": [first.as_dict(), duplicate], "invalid_records": [{"id": "already_quarantined"}], "history": []})
                  store = object.__new__(NotificationStore)
                  store._store = raw
                  store.records = {}
                  store.invalid_records = []
                  store.history = []
                  await store.async_load()
                  assert list(store.records) == [first.id]
                  assert len(store.invalid_records) == 2
                  await store.async_save()
                  assert len(raw.saved["records"]) == 1
                  assert len(raw.saved["invalid_records"]) == 2


              def test_summary_sensor_does_not_expose_record_identity():
                  record = NotificationRecord.create(definition(name="Private title"), "u1")
                  record.last_trigger_at = "2026-08-30T12:00:00+00:00"
                  manager = SimpleNamespace(store=SimpleNamespace(records={record.id: record}))
                  attributes = ConditionalNotificationsSensor(manager).extra_state_attributes
                  assert attributes["last_triggered_at"] == record.last_trigger_at
                  assert "last_triggered" not in attributes
                  assert record.id not in repr(attributes)
                  assert record.name not in repr(attributes)


              def test_mutating_services_support_optional_response():
                  registrations = {}

                  class Services:
                      def async_register(self, domain, service, handler, **kwargs):
                          registrations[service] = kwargs["supports_response"]

                  hass = SimpleNamespace(services=Services())
                  async_register_services(hass, Mock())
                  assert registrations["list"] is SupportsResponse.ONLY
                  assert registrations["get"] is SupportsResponse.ONLY
                  for service in ("create", "update", "delete", "pause", "resume", "enable", "disable", "rearm", "duplicate", "test", "trigger_now", "fire_named_trigger", "clear_history"):
                      assert registrations[service] is SupportsResponse.OPTIONAL


              def test_seed_current_for_starts_fresh_duration_proof():
                  accepted = []
                  scheduled = {}
                  runtime = SimpleNamespace(schedule_duration=lambda index, seconds, action: scheduled.update(index=index, seconds=seconds, action=action))
                  state = State("binary_sensor.motion", "on", {"friendly_name": "Motion"})
                  manager = object.__new__(NotificationManager)
                  manager.hass = SimpleNamespace(states=FakeStates({state.entity_id: state}))
                  manager._seed_current_duration(runtime, {"type": "state", "entity_id": state.entity_id, "to": "on", "for": 30}, 0, accepted.append)
                  assert scheduled["seconds"] == 30
                  assert accepted == []
                  scheduled["action"]()
                  assert len(accepted) == 1
                  assert accepted[0]["matched_current_state"] is True


              @pytest.mark.asyncio
              async def test_initialize_requests_fresh_duration_proof():
                  record = NotificationRecord.create(definition(), "u1")
                  store = SimpleNamespace(records={record.id: record}, history=[], invalid_records=[], async_load=AsyncMock(), async_save=AsyncMock())
                  manager = object.__new__(NotificationManager)
                  manager.hass = SimpleNamespace()
                  manager.options = {**DEFAULT_OPTIONS}
                  manager.store = store
                  manager._shutting_down = False
                  manager._validate_templates = Mock()
                  manager._prune_history = Mock()
                  manager.async_rebuild = AsyncMock()
                  await manager.async_initialize()
                  manager.async_rebuild.assert_awaited_once_with(record, prove_current_durations=True)


              def test_current_zone_resolution_uses_in_zones_membership():
                  zone = State("zone.work", "0", {"friendly_name": "Work"})
                  person = State("person.alex", "home", {"in_zones": ["zone.work"]})
                  manager = object.__new__(NotificationManager)
                  manager.hass = SimpleNamespace(states=FakeStates({zone.entity_id: zone, person.entity_id: person}))
                  record = NotificationRecord.create(definition(resolve_when={"type": "zone", "entity_id": person.entity_id, "zone_entity_id": zone.entity_id, "event": "enter"}), "u1")
                  record.active_occurrence = True
                  context = manager._current_resolution_context(record)
                  assert context is not None
                  assert context["matched_current_resolution"] is True
              '''))
          PY
          ruff format custom_components/conditional_notifications tests/test_final_robustness.py
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components tests/test_final_robustness.py .github/workflows/ci.yml
          git commit -m "fix: finish robustness bug sweep"
          git push origin HEAD:fix/final-robustness-cleanup
