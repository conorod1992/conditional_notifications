name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements_test.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy custom_components/conditional_notifications
      - run: pytest --cov=custom_components.conditional_notifications --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code
