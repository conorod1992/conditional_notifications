                  def test_from_only_duration_survives_unrelated_changes_until_returning_to_from():
                      definition_ = {
                          "type": "state",
                          "entity_id": "sensor.mode",
                          "from": "off",
                      }
                      assert _state_still_matches(definition_, State("sensor.mode", "on"))
