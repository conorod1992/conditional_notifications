                          "from": ["a"],
                          "to": ["a", "b"],
                      }
                      old = State("sensor.mode", "ok", {"members": ["a"]})
                      new = State("sensor.mode", "ok", {"members": ["a", "b"]})
                      assert _state_match(trigger, old, new)


