name: Final post-merge tweak

on:
  push:
    branches:
      - fix/post-merge-sweep-1.2.4

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-merge-sweep-1.2.4
      - name: Apply final source tweaks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != count:
                  raise RuntimeError(f'{path}: expected {count} matches, got {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'custom_components/conditional_notifications/triggers.py',
              '''                    try:\n                        value = float(state_value(new, definition.get("attribute")))\n                    except (TypeError, ValueError):\n                        value = None\n                    still_matching = numeric_matches(value, definition)\n''',
              '''                    try:\n                        value = float(state_value(new, definition.get("attribute")))\n                    except (TypeError, ValueError):\n                        value = None\n                    if value is not None and not math.isfinite(value):\n                        value = None\n                    still_matching = numeric_matches(value, definition)\n''',
              1,
          )
          replace(
              'custom_components/conditional_notifications/triggers.py',
              '''                    try:\n                        value = float(state_value(current, definition.get("attribute")))\n                    except (TypeError, ValueError):\n                        value = None\n                    still_matches = numeric_matches(value, definition)\n''',
              '''                    try:\n                        value = float(state_value(current, definition.get("attribute")))\n                    except (TypeError, ValueError):\n                        value = None\n                    if value is not None and not math.isfinite(value):\n                        value = None\n                    still_matches = numeric_matches(value, definition)\n''',
              1,
          )

          p = Path('custom_components/conditional_notifications/validation.py')
          text = p.read_text(encoding='utf-8')
          old = '''    if "notify_entities" in delivery:\n        delivery["notify_entities"] = [\n            _entity_id(entity_id, "delivery.notify_entities", domain="notify")\n            for entity_id in delivery["notify_entities"]\n        ]\n'''
          new = '''    if "notify_entities" in delivery:\n        for entity_id in delivery["notify_entities"]:\n            if not isinstance(entity_id, str) or not entity_id.startswith("notify."):\n                _error("delivery.notify_entities", "may contain only notify entity IDs")\n        delivery["notify_entities"] = [\n            _entity_id(entity_id, "delivery.notify_entities", domain="notify")\n            for entity_id in delivery["notify_entities"]\n        ]\n'''
          if text.count(old) != 1:
              raise RuntimeError('notify_entities validation shape changed')
          text = text.replace(old, new, 1)
          old = '''    if "assist_satellites" in delivery:\n        delivery["assist_satellites"] = [\n            _entity_id(\n                entity_id,\n                "delivery.assist_satellites",\n                domain="assist_satellite",\n            )\n            for entity_id in delivery["assist_satellites"]\n        ]\n'''
          new = '''    if "assist_satellites" in delivery:\n        for entity_id in delivery["assist_satellites"]:\n            if not isinstance(entity_id, str) or not entity_id.startswith("assist_satellite."):\n                _error(\n                    "delivery.assist_satellites",\n                    "may contain only Assist satellite entity IDs",\n                )\n        delivery["assist_satellites"] = [\n            _entity_id(\n                entity_id,\n                "delivery.assist_satellites",\n                domain="assist_satellite",\n            )\n            for entity_id in delivery["assist_satellites"]\n        ]\n'''
          if text.count(old) != 1:
              raise RuntimeError('assist_satellites validation shape changed')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/final-post-merge-tweak.yml
          git add custom_components/conditional_notifications/triggers.py custom_components/conditional_notifications/validation.py
          git commit -m "fix: finish numeric and delivery validation hardening"
          git push origin HEAD:fix/post-merge-sweep-1.2.4
