name: Fix native editor overflow v2

on:
  push:
    branches: [fix/native-editor-containment-rendering]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-editor-containment-rendering
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/fix_native_editor_overflow_v2.py
      - run: git diff --check
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/conditional_notifications/frontend/conditional-notifications-panel-native-automation.js frontend/tests/native-automation.test.mjs
          git commit -m "fix: constrain embedded native automation editors"
          git push origin HEAD:fix/native-editor-containment-rendering
